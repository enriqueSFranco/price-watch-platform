[project]
name = "pricewatch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "enriqueSFranco", email = "enrique.sfranco04@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "parsel>=1.12.1",
    "playwright>=1.64.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
pricewatch = "pricewatch:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
strict = true
python_version = "3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "browser: abre un Chromium real (mas lento); omitir con -m 'not browser'",
]
